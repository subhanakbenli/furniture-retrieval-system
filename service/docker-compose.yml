services:
  qdrant:
    image: qdrant/qdrant:v1.16.2
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"   # local access only (debugging / running the API outside Docker)
    restart: unless-stopped

  api:
    build: .
    image: furniture-retrieval:latest
    environment:
      QDRANT_HOST: qdrant
    volumes:
      - uploads:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  ui:
    build: .
    image: furniture-retrieval:latest
    command: ["streamlit", "run", "src/frontend.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_storage:
  uploads:
